services:
  redis:
    # Redis 8 incluye RedisJSON y RediSearch, que necesita langgraph-checkpoint-redis.
    image: redis:8.2
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
